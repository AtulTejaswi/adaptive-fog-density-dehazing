# ---------------------------------------------------------------------------
# All tunable values for the adaptive fog-density-aware dehazing project.
# Nothing in src/ should hard-code a threshold, radius or strength: add it here.
# Calibrated (data-derived) values live in config/calibration.json and
# config/tuned_params.json so that this file stays human-editable.
# ---------------------------------------------------------------------------

project:
  seed: 42

paths:
  calibration: config/calibration.json
  calibration_local: config/calibration_local.json
  tuned_params: config/tuned_params.json
  tuned_params_v2: config/tuned_params_v2.json
  niqe_model: config/niqe_model.json
  selector_classifier: config/selector_classifier.joblib
  splits: data/splits.json

preprocess:
  resize_long_side: 640
  denoise:
    enabled: true
    method: bilateral          # bilateral | none
    diameter: 5
    sigma_color: 20
    sigma_space: 20

density:
  patch_size: 15
  entropy_bins: 256
  contrast_percentiles: [5, 95]
  weights:
    dark_channel: 0.45
    entropy: 0.30
    contrast: 0.25
  normalization:
    low_percentile: 2
    high_percentile: 98
  features:                    # ablation switches (all on in the main method)
    dark_channel: true
    entropy: true
    contrast: true

selector:
  mode: three_bin              # three_bin | continuous | classifier
  thresholds:                  # fallback; overwritten by config/calibration.json
    t1: 0.33
    t2: 0.66
  continuous:
    omega: [0.70, 0.96]
    t0: [0.30, 0.09]
    clahe_clip: [3.00, 1.40]
    retinex_strength: [0.60, 0.00]
  classifier:
    max_depth: 3
    min_samples_leaf: 5
    test_size: 0.25

dehaze:
  classes:
    light:
      omega: 0.70
      t0: 0.30
      patch_size: 15
      guided_filter: {radius: 40, eps: 0.001}
      clahe: {enabled: true, clip_limit: 3.0, strength: 0.4, tile_grid_size: [8, 8]}
      retinex: {enabled: true, method: msr, sigmas: [15, 80, 250], strength: 0.60}
      gray_world: {enabled: true, strength: 0.60}
    moderate:
      omega: 0.85
      t0: 0.20
      patch_size: 15
      guided_filter: {radius: 60, eps: 0.001}
      clahe: {enabled: true, clip_limit: 2.0, strength: 0.4, tile_grid_size: [8, 8]}
      retinex: {enabled: true, method: msr, sigmas: [15, 80, 250], strength: 0.35}
      gray_world: {enabled: true, strength: 0.60}
    heavy:
      omega: 0.95
      t0: 0.10
      patch_size: 15
      guided_filter: {radius: 60, eps: 0.0001}
      clahe: {enabled: true, clip_limit: 1.5, strength: 0.4, tile_grid_size: [8, 8]}
      retinex: {enabled: false, method: msr, sigmas: [15, 80, 250], strength: 0.0}
      gray_world: {enabled: true, strength: 0.50}

  enhancement_order: [retinex, clahe, gray_world]
  defaults:                    # used when a class entry omits a key
    patch_size: 15
    guided_filter: {radius: 60, eps: 0.001}
    clahe: {enabled: true, clip_limit: 2.0, strength: 0.4, tile_grid_size: [8, 8]}
    retinex: {enabled: false, method: msr, sigmas: [15, 80, 250], strength: 0.0}
    gray_world: {enabled: false, strength: 0.5}

  baseline:                    # THE fixed-parameter DCP baseline (D-02)
    omega: 0.95
    t0: 0.10
    patch_size: 15
    guided_filter: {radius: 60, eps: 0.0001}

  max_omega: 0.97
  min_t0: 0.05

enhance:
  clahe:
    enabled: true
    clip_limit: 2.0
    strength: 0.4
    tile_grid_size: [8, 8]
  retinex:
    enabled: true
    method: msr                # ssr | msr
    sigmas: [15, 80, 250]
    strength: 0.5
  gray_world:
    enabled: true
    strength: 0.6
    max_gain: 1.25

# ---------------------------------------------------------------------------
# v2 upgrade (opt-in).  Every flag defaults to off: with all of them off the
# adaptive pipeline reproduces v1.0 exactly (tests/test_v2_compat.py).
# ---------------------------------------------------------------------------
v2:
  enabled: false                # master switch for the v2 path
  airlight:
    method: v1                  # v1 | v2 | quadtree
    candidate_percent: 0.5
    min_component_fraction: 0.0005
    gradient_percentile: 60
    quadtree:
      min_size: 32
      max_depth: 6
  sky:
    enabled: false
    brightness_threshold: 0.80
    gradient_threshold: 0.04
    min_area_fraction: 0.02
    morph_kernel: 5
    t_floor: 0.35
    blend: 0.35
  local_density:
    enabled: false
    window: 31
    smooth_radius: 15
    smooth_eps: 0.001
    omega_bounds: [0.70, 0.97]
    t0_bounds: [0.05, 0.40]
    map_blend: 1.0              # 0 = scalar v1 params, 1 = full local map
  enhance:
    local_blend: false
    floor: 0.30                 # minimum enhancement blend in clear regions
  retinex:
    fast: false                 # guided-filter illumination on a downsampled copy
    scale: 0.5

baselines:
  cap:
    beta: 1.0                   # published CAP theta coefficients; fixed beta
    t0: 0.10
    patch_size: 15
  bccr:
    omega: 0.95
    t0: 0.10
    patch_size: 15
    guided_filter: {radius: 60, eps: 0.0001}

metrics:
  ssim_data_range: 1.0
  edge_operator: sobel
  niqe:
    reg: 1.0e-3
  fade:
    # Fixed weights over the Choi (2015) FADE feature set.  Documented as a
    # simplified FADE-style index (the official learned model is not shipped).
    weights:
      dark_channel: 0.35
      contrast: 0.25
      saturation: 0.15
      colorfulness: 0.15
      entropy: 0.10

evaluation:
  splits_file: data/splits.json
  results_dir: results
  limit_per_split: null        # set an int for a quick subset run
  save_visuals: true
  visuals_per_split: 6
  bootstrap: 1000

tuning:
  calib_limit: 36
  per_class_budget: 18         # max full-pipeline runs per class
  objective:
    ssim_weight: 0.50
    psnr_weight: 0.30
    edge_weight: 0.20
    psnr_reference: 40.0
  grid:
    omega: [0.75, 0.85, 0.95]
    t0: [0.10, 0.20, 0.30]
    clahe_clip: [1.5, 2.0, 3.0]
    retinex_strength: [0.0, 0.35, 0.60]
  # Physical design prior: weaker correction for light haze, stronger for
  # heavy haze.  The search is constrained to these per-class ranges so the
  # tuned parameters remain interpretable and monotone in fog density.
  class_grids:
    light:
      omega: [0.70, 0.78, 0.86]
      t0: [0.20, 0.30, 0.35]
    moderate:
      omega: [0.82, 0.88, 0.94]
      t0: [0.10, 0.20, 0.30]
    heavy:
      omega: [0.90, 0.94, 0.97]
      t0: [0.05, 0.10, 0.20]

data:
  sots_url: "https://huggingface.co/datasets/desonglll/reside-SOTS/resolve/main/SOTS.zip"
  sots_zip: data/downloads/SOTS.zip
  download_timeout: 1800
  real_sots:
    max_pairs: 600
    calib_fraction: 0.55
  synthetic:
    calib: 96
    test_sots: 120
    test_rtts: 48
    selector_train: 180
    density_validation: 8
    image_size: [384, 512]
    beta_ranges:
      light: [0.15, 0.55]
      moderate: [0.55, 1.10]
      heavy: [1.10, 2.10]
    density_betas: [0.15, 0.30, 0.50, 0.75, 1.00, 1.35, 1.75, 2.20]
    atmospheric_light: [0.82, 0.95]
    noise_sigma: 0.004
