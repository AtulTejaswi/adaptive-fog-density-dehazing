[project]
name = "adaptive-dehazing"
version = "1.0.0"
description = "Adaptive, fog-density-aware single-image dehazing (IPA course project)"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
  "ignore::DeprecationWarning",
]
